<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="{% block viewport %}width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no{% endblock %}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Inventera{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/font-awesome/css/font-awesome.min.css') }}">
    <script src="{{ url_for('static', filename='ha-theme.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/jquery-3.6.0.min.js') }}"></script>
    <script>
        $.ajaxSetup({
            beforeSend: function(xhr, s) {
                if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(s.type) && !this.crossDomain) {
                    xhr.setRequestHeader("X-CSRFToken", document.querySelector('meta[name="csrf-token"]').content);
                }
            }
        });
    </script>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="background_wrapper"></div>
    <div class="card">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
