[project]
name = "inventera"
version = "2.5.0"
description = "Modern, mobile-friendly inventory and shopping list web application integrated with Home Assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "SQLAlchemy>=2.0.36",
    "Werkzeug>=3.0.0",
    "Jinja2>=3.1.4",
    "requests>=2.32.0",
    "gunicorn>=22.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-requests>=2.32.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/data", "instance", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/data", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
